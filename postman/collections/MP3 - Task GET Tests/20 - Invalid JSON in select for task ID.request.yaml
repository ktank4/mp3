$kind: http-request
description: Requires GET /:id to parse select and return 400 for invalid JSON.
url: "{{baseUrl}}/tasks/{{taskId}}?select=%7B%22name%22%3A"
method: GET
queryParams:
  select: "%7B%22name%22%3A"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 400", function () {
          pm.response.to.have.status(400);
      });
    language: text/javascript
order: 20000

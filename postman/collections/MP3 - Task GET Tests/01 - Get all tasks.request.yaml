$kind: http-request
url: "{{baseUrl}}/tasks"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns an array of tasks", function () {
          pm.expect(pm.response.json().data).to.be.an("array");
      });
    language: text/javascript
order: 1000

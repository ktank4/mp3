$kind: http-request
url: "{{baseUrl}}/tasks"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns no more than 100 tasks", function () {
          pm.expect(pm.response.json().data.length).to.be.at.most(100);
      });
    language: text/javascript
order: 10000

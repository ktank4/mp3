$kind: http-request
url: "{{baseUrl}}/tasks?select=%7B%22_id%22%3A0%7D"
method: GET
queryParams:
  select: "%7B%22_id%22%3A0%7D"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tasks do not contain an ID field", function () {
          pm.response.json().data.forEach(function (task) {
              pm.expect(task).to.not.have.property("_id");
          });
      });
    language: text/javascript
order: 8000

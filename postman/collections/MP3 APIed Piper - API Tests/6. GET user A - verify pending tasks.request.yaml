$kind: http-request
description: Run in order. This collection stores IDs in collection variables for later requests.
url: "{{baseUrl}}/users/{{userA}}"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Found user (200)', () => pm.response.to.have.status(200));
      const ids = pm.response.json().data.pendingTasks.map(String);
      pm.test('Both tasks are listed', () => { pm.expect(ids).to.include(pm.collectionVariables.get('taskOne')); pm.expect(ids).to.include(pm.collectionVariables.get('taskTwo')); });
    language: text/javascript
order: 6000

$kind: http-request
description: Run in order. This collection stores IDs in collection variables for later requests.
url: "{{baseUrl}}/tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman task two",
      "description": "Will be moved to user A",
      "deadline": "2030-01-02T12:00:00.000Z",
      "completed": false,
      "assignedUser": "{{userB}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Created task (201)', () => pm.response.to.have.status(201));
      const d = pm.response.json().data;
      pm.collectionVariables.set('taskTwo', d._id);
      pm.test('Task assigned to user B', () => pm.expect(d.assignedUser).to.eql(pm.collectionVariables.get('userB')));
    language: text/javascript
order: 4000

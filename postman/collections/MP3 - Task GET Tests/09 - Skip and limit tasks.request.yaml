$kind: http-request
url: "{{baseUrl}}/tasks?skip=2&limit=3"
method: GET
queryParams:
  skip: "2"
  limit: "3"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns no more than 3 tasks", function () {
          pm.expect(pm.response.json().data.length).to.be.at.most(3);
      });
    language: text/javascript
order: 9000

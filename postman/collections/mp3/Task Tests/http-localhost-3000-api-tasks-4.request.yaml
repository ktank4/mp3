$kind: http-request
name: http://localhost:3000/api/tasks
description: ""
url: http://localhost:3000/api/tasks
method: POST
body:
  type: json
  content: |-
    {
        "name": "Finish homework",
        "deadline": "2026-11-01",
        "completed": "yes"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns 400 for invalid completed value", () => {
          pm.response.to.have.status(400);
      });

      pm.test("Returns error response", () => {
          var response = pm.response.json();

          pm.expect(response.message).to.exist;
          pm.expect(response.data).to.eql(null);
      });
    language: text/javascript
order: 6000

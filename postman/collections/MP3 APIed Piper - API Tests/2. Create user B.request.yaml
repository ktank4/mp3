$kind: http-request
description: Run in order. This collection stores IDs in collection variables for later requests.
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman User B",
      "email": "{{emailB}}",
      "pendingTasks": []
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('emailB', 'postman-b-' + Date.now() + '@example.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Created user (201)', () => pm.response.to.have.status(201));
      const d = pm.response.json().data;
      pm.collectionVariables.set('userB', d._id);
    language: text/javascript
order: 2000

$kind: http-request
description: Requires collection variable taskId to contain an existing task ID.
url: "{{baseUrl}}/tasks/{{taskId}}?select=%7B%22name%22%3A1%2C%22completed%22%3A1%7D"
method: GET
queryParams:
  select: "%7B%22name%22%3A1%2C%22completed%22%3A1%7D"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns selected task fields", function () {
          var task = pm.response.json().data;
          pm.expect(task).to.have.property("name");
          pm.expect(task).to.have.property("completed");
          pm.expect(Object.keys(task)).to.have.members(["_id", "name", "completed"]);
      });
    language: text/javascript
order: 18000

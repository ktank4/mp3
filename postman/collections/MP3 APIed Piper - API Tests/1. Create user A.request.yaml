$kind: http-request
description: Run in order. This collection stores IDs in collection variables for later requests.
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Postman User A",
      "email": "{{emailA}}",
      "pendingTasks": []
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set('emailA', 'postman-a-' + Date.now() + '@example.com');
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Created user (201)', () => pm.response.to.have.status(201));
      const d = pm.response.json().data;
      pm.test('Response includes user id', () => pm.expect(d).to.have.property('_id'));
      pm.collectionVariables.set('userA', d._id);
    language: text/javascript
order: 1000

$kind: http-request
description: Uses the collection variable taskId. Create a task first and save its ID to that variable.
url: http://localhost:3000/api/tasks?where={"_id":{"$in":["{{taskId}}"]}}
method: GET
queryParams:
  where: '{"_id":{"$in":["{{taskId}}"]}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns an array containing only the requested task ID", function () {
          var tasks = pm.response.json().data;
          tasks.forEach(function (task) {
              pm.expect(task._id).to.eql(pm.collectionVariables.get("taskId"));
          });
      });
    language: text/javascript
order: 3000

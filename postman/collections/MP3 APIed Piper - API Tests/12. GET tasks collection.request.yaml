$kind: http-request
description: Run in order. This collection stores IDs in collection variables for later requests.
url: "{{baseUrl}}/tasks"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Tasks collection returns 200', () => pm.response.to.have.status(200));
      pm.test('Response data is an array', () => pm.expect(pm.response.json().data).to.be.an('array'));
    language: text/javascript
order: 12000

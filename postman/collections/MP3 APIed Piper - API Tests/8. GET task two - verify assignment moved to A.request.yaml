$kind: http-request
description: Run in order. This collection stores IDs in collection variables for later requests.
url: "{{baseUrl}}/tasks/{{taskTwo}}"
method: GET
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('Found task (200)', () => pm.response.to.have.status(200));
      pm.test('Task now assigned to A', () => pm.expect(pm.response.json().data.assignedUser).to.eql(pm.collectionVariables.get('userA')));
      pm.test('Assigned name updated', () => pm.expect(pm.response.json().data.assignedUserName).to.eql('Postman User A Updated'));
    language: text/javascript
order: 8000

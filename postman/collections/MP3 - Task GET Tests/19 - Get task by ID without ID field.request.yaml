$kind: http-request
description: Requires collection variable taskId to contain an existing task ID.
url: "{{baseUrl}}/tasks/{{taskId}}?select=%7B%22_id%22%3A0%7D"
method: GET
queryParams:
  select: "%7B%22_id%22%3A0%7D"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Does not return the ID field", function () {
          pm.expect(pm.response.json().data).to.not.have.property("_id");
      });
    language: text/javascript
order: 19000

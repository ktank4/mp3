$kind: http-request
url: "{{baseUrl}}/tasks?where=%7B%22completed%22%3Atrue%7D&sort=%7B%22name%22%3A1%7D&skip=0&limit=5&select=%7B%22name%22%3A1%2C%22completed%22%3A1%7D"
method: GET
queryParams:
  where: "%7B%22completed%22%3Atrue%7D"
  sort: "%7B%22name%22%3A1%7D"
  skip: "0"
  limit: "5"
  select: "%7B%22name%22%3A1%2C%22completed%22%3A1%7D"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 200", function () {
          pm.response.to.have.status(200);
      });
      var tasks = pm.response.json().data;
      pm.test("Returns no more than 5 tasks", function () {
          pm.expect(tasks.length).to.be.at.most(5);
      });
      pm.test("All returned tasks are completed", function () {
          tasks.forEach(function (task) { pm.expect(task.completed).to.eql(true); });
      });
      pm.test("Tasks are sorted alphabetically", function () {
          for (var i = 1; i < tasks.length; i++) {
              pm.expect(tasks[i - 1].name.localeCompare(tasks[i].name)).to.be.at.most(0);
          }
      });
      pm.test("Only selected fields and default ID are returned", function () {
          tasks.forEach(function (task) {
              pm.expect(Object.keys(task)).to.have.members(["_id", "name", "completed"]);
          });
      });
    language: text/javascript
order: 17000

$kind: http-request
url: "{{baseUrl}}/tasks?sort=%7B%22name%22%3A-1%7D"
method: GET
queryParams:
  sort: "%7B%22name%22%3A-1%7D"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Tasks are sorted in descending order", function () {
          var tasks = pm.response.json().data;
          for (var i = 1; i < tasks.length; i++) {
              pm.expect(tasks[i - 1].name.localeCompare(tasks[i].name)).to.be.at.least(0);
          }
      });
    language: text/javascript
order: 6000

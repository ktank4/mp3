$kind: http-request
url: "{{baseUrl}}/tasks?where=%7B%22completed%22%3Atrue%7D"
method: GET
queryParams:
  where: "%7B%22completed%22%3Atrue%7D"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Returns status 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("All returned tasks are completed", function () {
          pm.response.json().data.forEach(function (task) {
              pm.expect(task.completed).to.eql(true);
          });
      });
    language: text/javascript
order: 2000

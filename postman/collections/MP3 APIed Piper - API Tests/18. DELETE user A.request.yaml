$kind: http-request
description: Run in order. This collection stores IDs in collection variables for later requests.
url: "{{baseUrl}}/users/{{userA}}"
method: DELETE
headers:
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: pm.test('Deleted user A (200 or 204)', () => pm.expect([200,204]).to.include(pm.response.code));
    language: text/javascript
order: 18000
